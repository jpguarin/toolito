<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile dryer done</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Work+Sans:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; font-family: 'Work Sans', system-ui, sans-serif; color: {{ t.text }}; background-color: {{ t.bg }}; background-image: linear-gradient({{ t.grid }} 2px, transparent 2px), linear-gradient(90deg, {{ t.grid }} 2px, transparent 2px); background-size: 44px 44px;">

<div aria-hidden="true" style="height: 20px; background-image: repeating-linear-gradient(90deg, {{ t.awnA }} 0 44px, {{ t.awnB }} 44px 88px);"></div>
<header style="background: {{ t.panel }}; border-bottom: 3px solid {{ t.line }}; padding: 6px 10px 6px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
<span style="font-family: Bungee, sans-serif; font-size: 22px; color: {{ t.signTitle }}; text-shadow: {{ t.glowTitle }};">TOOLITO</span>
<button type="button" aria-label="Open menu" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: {{ t.panelText }}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</header>

<div style="flex: 1; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px;">
<div style="width: 100%; background: {{ t.paper }}; border: 4px solid {{ t.hot }}; border-radius: 20px; overflow: hidden; box-shadow: {{ t.hotRing }};">
<div style="background: {{ t.hot }}; color: {{ t.onHot }}; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center;"><span style="font-family: Bungee, sans-serif; font-size: 16px;">No.3 · DRYER</span><span style="font-family: Bungee, sans-serif; font-size: 12px; background: {{ t.ledBg }}; color: {{ t.led }}; padding: 3px 8px; border-radius: 4px;">DONE</span></div>
<div style="padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
<div style="width: 150px; height: 150px; border-radius: 999px; border: 14px solid {{ t.rim }}; box-shadow: 0 0 0 4px {{ t.line }}; background: {{ t.g5 }}; display: flex; align-items: center; justify-content: center;"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="{{ t.i5 }}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg></div>
<h1 style="margin: 0; font-size: 28px; line-height: 1.1; font-weight: 800;">Your PDF shrank 63%</h1>
<div style="font-size: 16px; font-weight: 600; color: {{ t.muted }};">12.4 MB → <strong style="color: {{ t.text }};">4.6 MB</strong> · fresh &amp; folded</div>
</div>
</div>

<div style="width: 100%; box-sizing: border-box; background: {{ t.note }}; color: {{ t.onNote }}; border: 2px solid {{ t.line }}; border-radius: 4px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px;">
<div style="font-family: Bungee, sans-serif; font-size: 12px; letter-spacing: 1px;">CARE LABEL</div>
<div style="display: flex; justify-content: space-between;"><span>Text</span><strong>Still selectable</strong></div>
<div style="display: flex; justify-content: space-between;"><span>Original</span><strong>Removed from dryer</strong></div>
<div style="display: flex; justify-content: space-between;"><span>Ironing</span><strong>Not needed</strong></div>
</div>

<div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px;">
<button type="button" style="min-height: 54px; border: 0; border-radius: 999px; background: {{ t.btn }}; color: {{ t.onBtn }}; font: 800 17px 'Work Sans', sans-serif; cursor: pointer;">Take it home (download)</button>
<button type="button" style="min-height: 48px; border: 3px solid {{ t.line }}; border-radius: 999px; background: transparent; color: {{ t.text }}; font: 800 15px 'Work Sans', sans-serif; cursor: pointer;">Run another load</button>
</div>
</div>

<div style="background: {{ t.panel }}; color: {{ t.panelText }}; border-top: 3px solid {{ t.line }}; height: 54px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">Advertisement · 320 × 50</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["auto","light","dark"],"default":"auto"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() {
var self = this;
this.clock = setInterval(function () { self.forceUpdate(); }, 60000);
}
componentWillUnmount() {
clearInterval(this.clock);
}
palette(name) {
if (name === 'dark') {
return { bg: '#0F1630', grid: '#1A2448', text: '#F4F1EA', muted: '#C9CEE0', line: '#F4F1EA', paper: '#1A2347', panel: '#070B1C', panelText: '#F4F1EA', ledBg: '#000000', led: '#3DE8F5', accent2: '#3DE8F5', onAccent2: '#0F1630', hot: '#FFE45E', onHot: '#0F1630', hotRing: '0 0 26px rgba(255,228,94,.4)', rim: '#8C96B8', awnA: '#FF5E6C', awnB: '#F4F1EA', signTitle: '#FF5E6C', glowTitle: '0 0 10px rgba(255,94,108,.9), 0 0 26px rgba(255,94,108,.6)', note: '#FFFDF8', onNote: '#0F1630', btn: '#FFE45E', onBtn: '#0F1630', g5: '#163D33', i5: '#5CF2A0' };
}
return { bg: '#BFE6DA', grid: '#A5D8C8', text: '#12233D', muted: '#33445E', line: '#12233D', paper: '#FFF4EA', panel: '#12233D', panelText: '#FFF4EA', ledBg: '#08121F', led: '#5CF2C2', accent2: '#5CF2C2', onAccent2: '#12233D', hot: '#FF4F5E', onHot: '#12233D', hotRing: 'none', rim: '#C5D0D6', awnA: '#FF4F5E', awnB: '#FFF4EA', signTitle: '#FF4F5E', glowTitle: 'none', note: '#FFFDF8', onNote: '#12233D', btn: '#12233D', onBtn: '#FFF4EA', g5: '#7DE3B2', i5: '#12233D' };
}
renderVals() {
var mode = this.props.mode || 'auto';
var h = new Date().getHours();
var night = h >= 19 || h < 7;
return { t: this.palette(mode === 'auto' ? (night ? 'dark' : 'light') : mode) };
}
}
</script>
</body>
</html>
