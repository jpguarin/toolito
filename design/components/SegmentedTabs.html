<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans)}
div[role=tablist]{display:inline-flex;border:var(--border-md) solid var(--line);border-radius:var(--radius-pill);overflow:hidden;background:var(--paper)}
button{min-height:46px;padding:0 18px;border:0;background:transparent;color:var(--ink);font:800 15px var(--font-sans);cursor:pointer}
button+button{border-left:var(--border-md) solid var(--line)}
button[aria-selected="true"]{background:var(--panel);color:var(--led)}
</style>
</head>
<body>
<div role="tablist" aria-label="Split mode">
<button type="button" role="tab" aria-selected="true">Pick pages</button><button type="button" role="tab" aria-selected="false">Ranges</button><button type="button" role="tab" aria-selected="false">Every page</button>
</div>
</body>
</html>
