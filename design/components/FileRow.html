<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Work+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;max-width:640px}
li{display:flex;flex-wrap:wrap;align-items:center;gap:16px;background:var(--card);border:var(--border-md) solid var(--line);border-radius:16px;padding:12px 14px}
li.busy{border-style:dashed}
.th{width:56px;height:56px;border-radius:10px;border:var(--border-thin) solid var(--line);flex-shrink:0}
.pdf{display:flex;align-items:center;justify-content:center;font-family:var(--font-sign);font-size:13px;background:var(--hot);color:var(--on-hot)}
.mid{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:4px}
.mid b{font-size:16px;font-weight:800}
.mid span{font-size:14px;color:var(--muted)}
.mid span strong{color:var(--ink)}
.save{font-family:var(--font-sign);font-size:15px;background:var(--ok);color:var(--on-ok);padding:6px 10px;border-radius:var(--radius-sm)}
.ib{width:44px;height:44px;border-radius:var(--radius-pill);border:var(--border-thin) solid var(--line);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bar{display:flex;align-items:center;gap:10px}
.track{flex:1;height:10px;border-radius:var(--radius-pill);border:var(--border-thin) solid var(--line);background:var(--bg);overflow:hidden}
.fill{width:45%;height:100%;background:var(--accent)}
.sec{min-height:44px;padding:0 16px;border-radius:var(--radius-pill);border:var(--border-thin) solid var(--line);background:transparent;color:var(--ink);font:800 14px var(--font-sans);cursor:pointer}
.err{color:var(--error);font-weight:800}
</style>
</head>
<body>
<ul>
<li><div class="th pdf" aria-hidden="true">PDF</div><div class="mid"><b>annual-report-2026.pdf</b><span>12.4 MB · 38 pages · loaded</span></div><button type="button" class="sec">Swap load</button></li>
<li class="busy"><div class="th" style="background:var(--glass-sort)" aria-hidden="true"></div><div class="mid"><b>team-photo.png</b><div class="bar"><div class="track" role="progressbar" aria-label="Washing team-photo.png" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><span>Spinning…</span></div></div></li>
<li><div class="th" style="background:var(--glass-image)" aria-hidden="true"></div><div class="mid"><b>beach-sunset.jpg</b><span>3.2 MB → <strong>0.9 MB</strong> · now WEBP</span></div><span class="save">−72%</span><button type="button" class="ib" aria-label="Download beach-sunset.jpg"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button></li>
<li><div class="th" style="background:var(--glass-convert)" aria-hidden="true"></div><div class="mid"><b>scan-001.heic</b><span class="err">This washer can't open HEIC yet.</span></div><button type="button" class="ib" aria-label="Remove scan-001.heic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></li>
</ul>
</body>
</html>
