<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Work+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}
.wrap{display:flex;flex-direction:column;gap:16px;max-width:460px}
.sum{background:var(--paper);border:var(--border-thick) solid var(--ok);border-radius:var(--radius-lg);padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.k{font-family:var(--font-sign);font-size:13px;letter-spacing:1px;color:var(--heading)}
.big{font-size:30px;font-weight:800;line-height:1.1}
.sub{font-size:16px;font-weight:600;color:var(--muted)}
.sub b{color:var(--ink)}
.label{background:var(--note);color:var(--on-note);border:var(--border-thin) solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.label .t{font-family:var(--font-sign);font-size:12px;letter-spacing:1px}
.r{display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
<div class="sum"><span class="k">FRESH &amp; FOLDED</span><span class="big">Your PDF shrank 63%</span><span class="sub">12.4 MB → <b>4.6 MB</b> · you saved 7.8 MB</span></div>
<div class="label"><span class="t">CARE LABEL</span>
<div class="r"><span>Cycle</span><strong>Normal</strong></div>
<div class="r"><span>Text</span><strong>Still selectable</strong></div>
<div class="r"><span>Original</span><strong>Removed from the dryer</strong></div>
</div>
</div>
</body>
</html>
