<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:24px;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.p{width:104px;height:104px;border-radius:var(--radius-pill);border:12px solid var(--rim);box-shadow:0 0 0 4px var(--line);display:flex;align-items:center;justify-content:center}
.big{width:150px;height:150px;border-width:18px}
</style>
</head>
<body>
<div class="row">
<div class="p" style="background:var(--glass-image)"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--icon-image)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></div>
<div class="p" style="background:var(--glass-convert)"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--icon-convert)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg></div>
<div class="p" style="background:var(--glass-dryer)"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--icon-dryer)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13l3 3 3-3"/></svg></div>
<div class="p" style="background:var(--glass-fold)"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--icon-fold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="8" height="12" rx="1.5"/><rect x="13" y="8" width="8" height="12" rx="1.5"/></svg></div>
<div class="p" style="background:var(--glass-sort)"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--icon-sort)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M2 12h20" stroke-dasharray="3 3"/></svg></div>
<div class="p big" style="background:var(--glass-sort)"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--icon-sort)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></div>
</div>
</body>
</html>
